name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --target x86_64-pc-windows-msvc
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-latest
            args: --target x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-targets: true
          cache-on-failure: true

      - name: Cache Tauri tools (NSIS, WiX)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tauri
            ~/.local/share/tauri
            ~/AppData/Local/Temp/.tauri
          key: tauri-tools-${{ matrix.platform }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev
          sudo apt-get install -y libayatana-appindicator3-dev 2>/dev/null || \
            sudo apt-get install -y libappindicator3-dev 2>/dev/null || true

      - name: Install macOS Rust targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Extract changelog for release body
        id: changelog
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          NOTE="$RUNNER_TEMP/changelog.md"

          # 这里必须失败即中断。曾经用 `|| echo "No changelog entry ..."` 兜底，
          # 结果是 tag 打在 CHANGELOG 提交之前时 CI 一路绿灯，latest.json 的
          # notes 被写成那句占位文案，终端用户点更新只能看到"暂无更新说明"。
          if ! node scripts/extract-changelog.mjs "$VERSION" > "$NOTE"; then
            echo "::error::CHANGELOG.md 中找不到 $VERSION 的条目。请先补好 CHANGELOG 并提交，再重新打 tag。"
            echo "CHANGELOG.md 现有版本条目："
            grep -E '^##[[:space:]]+v?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md || true
            exit 1
          fi

          if [ ! -s "$NOTE" ]; then
            echo "::error::$VERSION 的 CHANGELOG 条目为空。"
            exit 1
          fi

          # 应用端 UpdateDialog.vue 的 renderMarkdownLines 只认这种结构：
          # 以 "## vX.Y.Z" 开头，靠 "### 分组" 建小节，靠 "- 条目" 收集内容。
          # 没有 "###" 分组时所有条目会被静默丢弃，用户端同样看到"暂无更新说明"。
          if ! head -n 1 "$NOTE" | grep -qE '^##[[:space:]]+v?[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::CHANGELOG 条目首行必须是 '## vX.Y.Z'，当前为：$(head -n 1 "$NOTE")"
            exit 1
          fi
          if ! grep -qE '^###[[:space:]]+\S' "$NOTE"; then
            echo "::error::$VERSION 的 CHANGELOG 条目缺少 '### 分组'，应用端会显示为空。请用 '### 分组' + '- 条目' 的结构编写。"
            exit 1
          fi
          if ! grep -qE '^[-*][[:space:]]+\S' "$NOTE"; then
            echo "::error::$VERSION 的 CHANGELOG 条目没有任何 '- 条目'，应用端会显示为空。"
            exit 1
          fi

          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat "$NOTE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "${{ github.ref_name }}"
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Create portable zip (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = "src-tauri/target/x86_64-pc-windows-msvc/release"
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          $staging = "portable/BullArrives"
          $null = New-Item -ItemType Directory -Force -Path $staging
          # 自动查找主程序 exe（productName 与 Cargo bin 名可能不同，不写死文件名）
          $exe = Get-ChildItem "$src/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "找不到可执行文件" }
          Copy-Item $exe.FullName -Destination "$staging/"
          Write-Host "打包主程序: $($exe.Name)"
          $null = New-Item -ItemType File -Path "$staging/portable.dat"
          $zipName = "BullArrives_$($ver)_x64-portable.zip"
          $null = New-Item -ItemType Directory -Force -Path "$src/bundle"
          Compress-Archive -Path "$staging/*" -DestinationPath "$src/bundle/$zipName"
          Write-Host "Portable zip created: $src/bundle/$zipName"

      - name: Upload portable zip to release
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          make_latest: false
          files: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/BullArrives_*_x64-portable.zip
